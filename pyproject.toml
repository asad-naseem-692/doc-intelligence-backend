[project]
name = "backend"
version = "0.1.0"
description = "AI Document Intelligence System Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.1",
    "email-validator>=2.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "llama-index-core>=0.10.0",
    "openai>=1.14.0",
    "passlib[bcrypt]>=1.7.4",
    "pgvector>=0.2.5",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pypdf>=4.1.0",
    "pytest>=8.0.0",
    "python-docx>=1.1.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.28",
    "uvicorn[standard]>=0.28.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
